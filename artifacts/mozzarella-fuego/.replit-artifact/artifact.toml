kind = "web"
previewPath = "/"
title = "Mozzarella y Fuego"
description = "Online ordering and admin management platform for Mozzarella y Fuego, a Brazilian pizza restaurant in Barcelona. Customers can browse the menu, customize pizzas, checkout with Stripe, and track their orders. The app also includes an admin panel for managing orders, menu items, reservations, and store settings."
version = "1.0.0"
id = "artifacts/mozzarella-fuego"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21646

[services.development]
run = "pnpm --filter @workspace/mozzarella-fuego run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mozzarella-fuego", "run", "build" ]
serve = "static"
publicDir = "artifacts/mozzarella-fuego/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21646"
BASE_PATH = "/"
